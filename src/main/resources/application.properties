spring.application.name=denunciaservice
server.port=8080

# MySQL local. La contraseña se toma de la variable de entorno DB_PASSWORD (no se guarda en el repositorio).
spring.datasource.url=jdbc:mysql://localhost:3306/denunciaservice?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
